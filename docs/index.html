<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burndown has moved to burndown-app.pages.dev</title>
<meta name="description" content="The Burndown home page has moved to https://burndown-app.pages.dev/.">
<link rel="canonical" href="https://burndown-app.pages.dev/">
<meta http-equiv="refresh" content="0; url=https://burndown-app.pages.dev/">
<style>
  :root{
    --bg:#F5F1EA; --card:#EEEAE3; --line:#DFD9CF;
    --ink:#292521; --sub:#6E6459; --clay:#C25A35;
    --serif:"New York","Iowan Old Style",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#1B1917; --card:#242020; --line:#3A3330; --ink:#EDE7DF; --sub:#A79C90; --clay:#D97757; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--ink);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  main{max-width:34rem;background:var(--card);border:1px solid var(--line);
       border-radius:14px;padding:32px 30px;text-align:center}
  h1{font-family:var(--serif);font-weight:600;font-size:1.6rem;margin:0 0 12px;letter-spacing:-.01em}
  p{margin:0 0 16px;color:var(--sub)}
  a{color:var(--clay)}
  .cta{display:inline-block;margin:6px 0 18px;padding:11px 20px;border-radius:10px;
       background:var(--clay);color:#fff;text-decoration:none;font-weight:600}
  .cta:hover{filter:brightness(1.07)}
  .small{font-size:.86rem;margin:0}
</style>
</head>
<body>
<main>
  <h1>Burndown has a new home</h1>
  <p>This page moved to <strong>burndown-app.pages.dev</strong>. You should be
  redirected in a moment.</p>
  <p><a class="cta" href="https://burndown-app.pages.dev/">Go to the Burndown home page</a></p>
  <p class="small">Not redirected? Use the button above, or go straight to the
  <a href="https://burndown-app.pages.dev/guide">full guide</a> or the
  <a href="https://github.com/maz0x/burndown">source on GitHub</a>.</p>
</main>
</body>
</html>
