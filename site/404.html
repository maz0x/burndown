<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Burndown</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#F5F1EA; --card:#EEEAE3; --line:#DFD9CF;
    --ink:#292521; --sub:#6E6459; --clay:#C25A35;
    --serif:"New York","Iowan Old Style",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#1B1917; --card:#242020; --line:#3A3330; --ink:#EDE7DF; --sub:#A79C90; --clay:#D97757; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--ink);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  main{max-width:34rem;background:var(--card);border:1px solid var(--line);
       border-radius:14px;padding:32px 30px;text-align:center}
  .code{font-family:var(--serif);font-size:2.6rem;line-height:1;color:var(--clay);margin:0 0 6px}
  h1{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:0 0 12px;letter-spacing:-.01em}
  p{margin:0 0 16px;color:var(--sub)}
  a{color:var(--clay)}
  .cta{display:inline-block;margin:6px 0 18px;padding:11px 20px;border-radius:10px;
       background:var(--clay);color:#fff;text-decoration:none;font-weight:600}
  .cta:hover{filter:brightness(1.07)}
  .small{font-size:.86rem;margin:0}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>That page isn't here</h1>
  <p>The link may be out of date, or the page may have moved when the site did.</p>
  <p><a class="cta" href="/">Go to the Burndown home page</a></p>
  <p class="small">Or try the <a href="/guide">full guide</a>, the
  <a href="https://github.com/maz0x/burndown">source on GitHub</a>, or the
  <a href="https://github.com/maz0x/burndown/releases/latest">latest release</a>.</p>
</main>
</body>
</html>
