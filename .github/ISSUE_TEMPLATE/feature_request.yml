name: Idea or feature request
description: Something you wish Burndown did.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like
      description: What are you trying to do, and what would make it easier?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: The situation where you would reach for this.
